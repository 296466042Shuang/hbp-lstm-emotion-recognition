name: smoke-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  public-reference:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest tests.test_shapes

      - name: Run inference smoke test
        run: python demo/inference_demo.py

      - name: Run training smoke test
        run: python train_reference.py
